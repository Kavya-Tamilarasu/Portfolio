  <rect width="100" height="100" rx="28" fill="#0f172a" stroke="url(#kt-grad)" stroke-width="4"/>
  <text x="50%" y="58%" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="url(#kt-grad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2" filter="url(#glow)">
